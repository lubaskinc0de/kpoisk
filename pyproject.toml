[project]
name = "kpoisk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lubaskin", email = "lubaskincorporation@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "adaptix>=3.0.0b12",
    "aiogram>=3.31.0",
    "aiogram-dialog>=2.6.0",
    "aiohttp-socks==0.12.0",
    "beautifulsoup4>=4.15.0",
    "dotenv>=0.9.9",
    "lxml>=6.1.3",
    "psycopg[binary,pool]>=3.3.6",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
kpoisk = "kpoisk:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
