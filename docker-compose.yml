services:
    db:
        container_name: db
        restart: unless-stopped
        image: postgres:17
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - 5432:5432
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 2s
        volumes:
            - pg_data:/var/lib/postgresql

volumes:
    pg_data:
